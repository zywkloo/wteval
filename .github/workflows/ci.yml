name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harness tests
        run: |
          chmod +x tests/run_all.sh scripts/*.py
          tests/run_all.sh
